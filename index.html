<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>할 일 목록</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>할 일 목록</h1>

  <div>
    <input type="text" id="todo-input" placeholder="할 일을 적어 보세요">
    <button type="button" id="add-button">추가</button>
  </div>

  <ul id="todo-list">
    <!-- 할 일 한 줄의 모습 (예시) -->
    <li>
      <input type="checkbox">
      <span>예시 할 일</span>
      <button type="button">삭제</button>
    </li>
  </ul>

  <p id="empty-message">아직 할 일이 없어요</p>
</body>
</html>
