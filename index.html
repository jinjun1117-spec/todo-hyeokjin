<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>할 일 목록</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>할 일 목록</h1>

  <div id="add-box">
    <div class="row">
      <input type="text" id="todo-input" placeholder="할 일을 적어 보세요" maxlength="100" autocomplete="off">
      <button type="button" id="add-button">추가</button>
    </div>
    <div class="row">
      <label for="due-input">마감일</label>
      <input type="date" id="due-input">
      <button type="button" id="important-toggle" aria-pressed="false">☆ 중요</button>
    </div>
  </div>

  <div id="filters">
    <button type="button" data-filter="all" aria-pressed="true">전체</button>
    <button type="button" data-filter="active" aria-pressed="false">진행 중</button>
    <button type="button" data-filter="done" aria-pressed="false">완료</button>
  </div>

  <ul id="todo-list"></ul>

  <p id="empty-message">아직 할 일이 없어요</p>

  <div id="footer" hidden>
    <span id="count">남은 할 일 0개</span>
    <button type="button" id="clear-done">완료한 것 지우기</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
