<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>할 일 목록</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="top">
    <div>
      <p id="today"></p>
      <h1 id="page-title">할 일 목록</h1>
    </div>
    <button type="button" id="theme-button" aria-label="다크 모드로 바꾸기">🌙</button>
  </header>

  <main>
    <section id="tab-todo" role="tabpanel" aria-label="할 일">
      <div id="day-bar">
        <button type="button" id="day-prev" aria-label="전날">‹</button>
        <div id="day-label">
          <strong id="day-text"></strong>
          <span id="day-dday" class="due"></span>
        </div>
        <button type="button" id="day-next" aria-label="다음날">›</button>
        <button type="button" id="day-today">오늘</button>
      </div>

      <div id="progress" hidden>
        <p id="progress-text">0 / 0 완료</p>
        <div id="progress-track"><div id="progress-fill"></div></div>
      </div>

      <div id="add-box">
        <input type="text" id="todo-input" placeholder="할 일을 적어 보세요" maxlength="100" autocomplete="off">
        <button type="button" id="add-button">추가</button>
      </div>

      <div id="filters">
        <button type="button" data-filter="all" aria-pressed="true">전체</button>
        <button type="button" data-filter="important" aria-pressed="false">중요</button>
        <button type="button" data-filter="active" aria-pressed="false">진행 중</button>
        <button type="button" data-filter="done" aria-pressed="false">완료</button>
      </div>

      <ul id="todo-list"></ul>

      <p id="empty-message" class="empty">이 날 할 일이 없어요</p>

      <div id="footer" hidden>
        <span id="count">남은 할 일 0개</span>
        <button type="button" id="clear-done">완료한 것 지우기</button>
      </div>
    </section>

    <section id="tab-calendar" role="tabpanel" aria-label="캘린더" hidden>
      <div id="cal-head">
        <button type="button" id="cal-prev" aria-label="이전 달">‹</button>
        <h2 id="cal-title"></h2>
        <button type="button" id="cal-next" aria-label="다음 달">›</button>
        <button type="button" id="cal-today">오늘</button>
      </div>
      <div id="cal-grid"></div>
    </section>

    <section id="tab-days" role="tabpanel" aria-label="날짜별 목록" hidden>
      <input type="search" id="search-input" placeholder="할 일 찾기" aria-label="할 일 찾기" autocomplete="off">
      <div id="range">
        <button type="button" data-range="upcoming" aria-pressed="true">오늘부터</button>
        <button type="button" data-range="all" aria-pressed="false">지난 날짜 함께 보기</button>
      </div>
      <div id="days-list"></div>
      <p id="days-empty" class="empty">아직 할 일이 없어요</p>
      <button type="button" id="sample-button">🧪 테스트 할 일 20개 넣기</button>
    </section>
  </main>

  <nav id="tabbar" role="tablist" aria-label="화면 고르기">
    <button type="button" role="tab" data-tab="todo" aria-selected="true"><span aria-hidden="true">✅</span>할 일</button>
    <button type="button" role="tab" data-tab="calendar" aria-selected="false"><span aria-hidden="true">📅</span>캘린더</button>
    <button type="button" role="tab" data-tab="days" aria-selected="false"><span aria-hidden="true">📋</span>날짜별 목록</button>
  </nav>

  <dialog id="day-popup" aria-labelledby="popup-title">
    <h2 id="popup-title"></h2>
    <ul id="popup-list"></ul>
    <p id="popup-empty" class="empty">이 날 할 일이 없어요</p>
    <div class="detail-row popup-actions">
      <button type="button" id="popup-close">닫기</button>
      <button type="button" id="popup-open">이 날짜 할 일 보기</button>
    </div>
  </dialog>

  <dialog id="detail" aria-labelledby="detail-heading">
    <h2 id="detail-heading">할 일 상세</h2>
    <label for="detail-title">제목</label>
    <input type="text" id="detail-title" maxlength="100" autocomplete="off">
    <label for="detail-memo">메모</label>
    <textarea id="detail-memo" rows="3" maxlength="1000" placeholder="자세한 내용을 적어 두세요"></textarea>
    <div class="detail-row">
      <button type="button" id="detail-important" aria-pressed="false">☆ 중요</button>
      <button type="button" id="detail-done" aria-pressed="false">☐ 완료</button>
    </div>
    <p class="detail-caption">날짜 옮기기</p>
    <div class="detail-row detail-move">
      <button type="button" id="detail-tomorrow">내일로 미루기</button>
      <button type="button" id="detail-pick" aria-expanded="false">날짜로 미루기</button>
    </div>
    <div id="detail-picker" hidden>
      <div class="picker-head">
        <button type="button" id="picker-prev" aria-label="이전 달">‹</button>
        <strong id="picker-title"></strong>
        <button type="button" id="picker-next" aria-label="다음 달">›</button>
      </div>
      <div id="picker-grid"></div>
    </div>
    <div class="detail-row detail-actions">
      <button type="button" id="detail-delete">삭제</button>
      <button type="button" id="detail-cancel">취소</button>
      <button type="button" id="detail-save">저장</button>
    </div>
  </dialog>

  <div id="toast" role="status" hidden>
    <span id="toast-text"></span>
    <button type="button" id="undo-button">되돌리기</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
